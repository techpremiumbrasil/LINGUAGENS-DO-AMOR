<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Realiza Aí — Studio DEV</title><style>html,body{margin:0;min-height:100%;background:#090a0f;color:#f5f7fb;font-family:Inter,system-ui,sans-serif}.boot{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}.spin{width:42px;height:42px;border:4px solid #29303d;border-top-color:#a18fff;border-radius:50%;animation:s .8s linear infinite;margin:0 auto 16px}@keyframes s{to{transform:rotate(360deg)}}b{color:#a18fff}.err{max-width:620px;border:1px solid #55303a;background:#1a1115;border-radius:14px;padding:20px;text-align:left}button{border:0;background:#7657ff;color:#fff;font-weight:800;padding:10px 14px;border-radius:9px;cursor:pointer}</style></head><body><div id="boot" class="boot"><div><div class="spin"></div><h2>Realiza <b>Aí</b></h2><p>Carregando Studio DEV…</p></div></div><script>(async()=>{const u='https://juikpbkodqqdanrwxoft.storage.supabase.co/storage/v1/object/public/site/index.html?v=220';const c=new AbortController();const t=setTimeout(()=>c.abort(),15000);try{const r=await fetch(u,{cache:'no-store',signal:c.signal});if(!r.ok)throw new Error('Falha ao carregar aplicação: HTTP '+r.status);const h=await r.text();if(!h.toLowerCase().includes('<!doctype html'))throw new Error('Aplicação recebida em formato inválido');clearTimeout(t);document.open();document.write(h);document.close()}catch(e){clearTimeout(t);document.getElementById('boot').innerHTML='<div class="err"><h2>Realiza <b>Aí</b></h2><h3>Não foi possível abrir o Studio</h3><p>'+String(e.message||e).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))+'</p><button onclick="location.reload()">Tentar novamente</button></div>'}})();</script></body></html>
